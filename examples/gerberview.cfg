# EH3D-GERBERVIEWER settings: key = value, a # starts a comment.
# Every value below is the default; delete a line to get the default back.

# ruler: how far from a click a vertex or a pad centre still catches it (0 to 10 mm)
snap_tolerance_mm = 0.15
snap_vertices = yes
snap_pad_centres = yes
# the unit of a measure: mm, in or mil
unit = mm

# layers: the opacity a layer has when added, and the opacity below which a shown layer is reported as almost invisible (0 to 1)
default_opacity = 0.85
min_visible_opacity = 0.05
# the most layers of a stack (1 to 1024)
max_layers = 64

# gap: the most pairs of shapes that are compared (1 to 100000000)
max_gap_pairs = 4000000
