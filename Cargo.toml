[package]
name = "eh3d-gerberviewer"
version = "0.0.7"
edition = "2021"
rust-version = "1.82"
description = "A light viewer of Gerber layers and drill files: SVG pictures with a colour and a transparency per layer, measures and alignment checks"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-GERBERVIEWER"
readme = "README.md"

[lib]
name = "eh3d_gerberviewer"
path = "src/lib.rs"

[[bin]]
name = "eh3d-gerberview"
path = "src/main.rs"

[features]
default = []
# the window (egui, with the icon of the program): `cargo run --release --features gui`
gui = ["dep:eframe", "dep:png"]

[dependencies]
# the readers of the suite (a path dependency on the sibling repository)
eh3d-parser-gerber = { version = ">=0.0.2", path = "../EH3D-CORE-LIBS/crates/eh3d-parser-gerber" }
eh3d-parser-excellon = { version = ">=0.0.2", path = "../EH3D-CORE-LIBS/crates/eh3d-parser-excellon" }
eh3d-geometry = { version = ">=0.0.3", path = "../EH3D-CORE-LIBS/crates/eh3d-geometry" }

# the window
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"], optional = true }
png = { version = "0.17", optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[profile.release]
opt-level = 3
lto = true

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
